# CI-reachability configuration (#lzcheckcireachguard), read by check-ci-reach.sh.
#
# workflow:  a workflow whose run: steps count as CI reach. Listing one here is a
#            claim that it runs on every push/PR — a tag-triggered release
#            workflow must not be listed, because reaching a gate only when you
#            cut a release is not reaching it.
# excuse:    a `make check` target that CI deliberately does not run, and why.
#            The target must be a MEMBER of `check`'s prerequisite closure — see
#            EXPECTED_CLOSURE_TARGETS in the guard. An excuse for anything else
#            is a hard failure now (#pinreachclosure): the guard consults
#            excuses only while walking that closure, so one naming a local-only
#            target such as `bench`, or a target name with a typo in it, used to
#            be accepted and then ignored — `0 excused`, no complaint, output
#            byte-identical to a clean run. It read as coverage and did no work.
#
# The excuse list is the point of this file. It is the one place a reader can see
# what this binding does not enforce in CI, in the same spirit as KNOWN_UNCOVERED.
# Excuses are verified in both directions: an excuse for a target CI turns out to
# reach is a hard failure, so this list cannot rot into things that used to be
# true.

workflow: .github/workflows/ci.yml

# scripts/ci-activation.conf makes the claim above executable: it pins the exact
# trigger/filter set, every job that carries a gate, each job's activation keys,
# and its matrix legs. Independent push + pull_request, default-branch,
# no-path-filter, and blocking-leg floors keep a matching pin edit from blessing
# a workflow or matrix that no longer gates commits (#verifyworkflowactually).

# No excuses. Every gate `make check` runs is reached by the CI workflow above,
# which is a claim the guard re-proves on every run rather than a note.
#
# The reverse direction, for a reader's benefit (this guard does not check it):
# `make wasm` is a real gate that `make check` deliberately does NOT run, because
# it requires the emsdk toolchain. It is reached by the separate `wasm` job in the
# workflow above, which builds both tiers, replays the conformance suite under
# Node, and audits the WASM.md matrix. So the wasm gate is enforced in CI without
# being in `check` — the one place that is true, and stated here rather than left
# to be discovered.
#
# The part of that gate which needs NO toolchain was split out rather than left
# on the far side of it: `wasm-corpus-column` audits the WASM.md Corpus column
# and family row set from the canonical corpus alone, and it IS in `check` and in
# the native job above (#lzcppwasmguardlocal). It requires ../lazily-spec — a
# corpus it cannot read is a hard failure there, not a skip, because a matrix
# compared against nothing passes.
