name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    # Coverage manifest every conformance binary APPENDS to at static-destruction
    # time (tests/test_spec_fixture.hpp). It carries BOTH the fixture-level rung
    # and the per-scenario declared/replayed ledger, and it is the only evidence
    # scripts/check-conformance-coverage.sh has. Set at job level so every ctest
    # invocation below inherits it, exactly as the Makefile's `test` target does
    # locally — a guard whose evidence file is never written passes VACUOUSLY
    # (#lzguardsnotinci).
    env:
      LAZILY_CONFORMANCE_MANIFEST: ${{ github.workspace }}/build/conformance-fixtures-loaded.txt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.compiler == 'g++' && 'g++' || 'clang' }}

      # uv is here only to pin clang-format (#lazilycppfmt). The runner's own
      # clang-format tracks whatever the image ships, which is a style that moves
      # under the gate; `make fmt` fetches the exact CLANG_FORMAT_VERSION instead,
      # so this step and a developer's laptop give the same verdict.
      - name: Install uv (pins clang-format for the format gate)
        uses: astral-sh/setup-uv@v7

      # `make fmt` is the GATE, not the fixer: it runs clang-format --dry-run
      # -Werror. The target it replaced ran `clang-format -i ... || true`, which
      # rewrote the tree and could not fail — putting THAT in CI would have been a
      # step that proves nothing while reading green (#lazilycppfmt).
      - name: Format gate (make fmt)
        run: make fmt
      # lazily-spec is the canonical cross-language conformance source. Clone it
      # as a sibling BEFORE configuring, so every conformance target resolves
      # ../lazily-spec/conformance/<area> and CI validates lazily-cpp against
      # the canonical fixtures rather than a copy in this repo (#lzspecconf).
      - name: Fetch canonical lazily-spec conformance fixtures (#lzspecconf)
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build --parallel
      # The conformance suites now REFUSE to run when the sibling checkout is
      # absent (#lzcppsiblingskipvsfail), so a corpus-less job cannot go green.
      # This step stays because a refusal 36 suites deep names the symptom late:
      # assert the corpus up front, per area, so a partial clone is reported as
      # the missing input it is rather than as a wall of failing tests.
      - name: Assert canonical conformance fixtures are present (#lzspecconf)
        run: |
          for area in coordination crdt-tree membership presence rateshape \
                      reactive-graph reliable-sync resilience service \
                      temporal windowing; do
            test -d "../lazily-spec/conformance/$area" || {
              echo "::error::../lazily-spec/conformance/$area missing — the $area conformance suite would skip instead of validating"
              exit 1
            }
          done
      # Truncated before the first ctest run so the manifest always describes
      # THIS run. A stale file left by an earlier step would let the coverage
      # and scenario guards pass on fixtures nobody read (#lzguardsnotinci).
      - name: Truncate the conformance coverage manifest (#lzguardsnotinci)
        shell: bash
        run: rm -f "$LAZILY_CONFORMANCE_MANIFEST"
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Cross-binding wire compatibility. `make check` builds and runs this peer;
      # no binding's CI ran it anywhere (#lzinteroppeerci). It is the gate that
      # matters most when nine bindings have to agree on a byte layout, and it
      # was the one gate living exclusively on developer machines.
      - name: Interop peer self-check (#lzinteroppeerci)
        run: ./build/lazily_interop_peer --self-check
      # ── the two guards that do NOT live inside the test binary ────────────
      #
      # Four conformance guards exist per binding. The unconsumed-assertion-key
      # and unasserted-assertion-key rungs std::abort() from inside the
      # conformance executables (tests/test_assertion_keys.hpp), so plain `ctest`
      # already enforces them. The fixture-manifest rung and the per-scenario
      # replay ledger are audited by scripts/check-conformance-coverage.sh, which
      # only `make check` invoked — CI ran ctest and never reached the script, so
      # both were silently unenforced here. Wire them in with the same env and
      # manifest truncation the Makefile uses locally (#lzguardsnotinci).
      #
      # The manifest is asserted non-empty FIRST. The script's own MIN_FIXTURES /
      # MIN_SCENARIOS floors do fail an empty manifest — verified — but a guard
      # that can only report "0 of everything" does not name WHY; failing on the
      # evidence file itself does.
      - name: Assert the coverage manifest was written (#lzguardsnotinci)
        shell: bash
        run: |
          if [[ ! -s "$LAZILY_CONFORMANCE_MANIFEST" ]]; then
            echo "::error::no conformance coverage manifest at $LAZILY_CONFORMANCE_MANIFEST — the fixture and scenario guards would audit nothing"
            exit 1
          fi
          echo "manifest records: $(wc -l < "$LAZILY_CONFORMANCE_MANIFEST")"
      # Fixture-level coverage plus the per-scenario replay ledger. The script
      # used to SKIP (exit 0) on an absent corpus, and this step grepped its log
      # for that SKIP line. It refuses instead now (#lzcppsiblingskipvsfail), so
      # the grep is gone and the fail-closed behaviour is proven directly, by the
      # step further down that points every corpus guard at a path that does not
      # exist and requires each one to redden.
      #
      # The manifest is passed through $LAZILY_CONFORMANCE_MANIFEST, the job-level
      # env var every other step here uses. This step used to hardcode a second
      # spelling of the same path plus an equality assertion to keep the two in
      # sync, purely because the reachability guard dropped variable-reference
      # tokens and so could not match an env-var argument (#lzcireachvaranchor).
      # The guard now treats an unresolvable variable as a single-token wildcard,
      # so the workaround — a new drift surface invented to satisfy a guard that
      # exists to detect drift — is gone.
      - name: Assert canonical fixtures and scenarios were replayed (#lzguardsnotinci)
        shell: bash
        run: |
          ./scripts/check-conformance-coverage.sh "$LAZILY_CONFORMANCE_MANIFEST"

      # Invoked through make rather than by spelling the python command a second
      # time: the target now carries an explicit sibling precondition in front of
      # the checker, and two commands in a recipe CI only half-runs is the very
      # drift the reachability guard at the end of this job exists to catch.
      - name: Assertion observation ordering (#lzassertordering)
        run: make assertion-ordering-check

      # The corpus-derivable half of the WASM.md matrix audit
      # (#lzcppwasmguardlocal). The full audit needs the emsdk manifests and so
      # lives in the `wasm` job below; that made the matrix unreachable from
      # `make check` and from this job, and 9b0ff08 proved the gap by passing
      # both and landing red on the matrix. The Corpus column and the family row
      # set need no toolchain, so they are gated here too — this job clones the
      # corpus, which is the only input. It is a SUBSET verdict by construction
      # and prints what it did not audit; the wasm job stays the full-fidelity
      # gate.
      - name: WASM.md corpus column + row set (#lzcppwasmguardlocal)
        shell: bash
        run: |
          out=$(./scripts/check-wasm-corpus-column.sh 2>&1) || { echo "$out"; echo "::error::the WASM.md matrix is stale against the canonical corpus"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "wasm corpus-column guard: OK" || {
            echo "::error::the corpus-column guard exited 0 without reaching its verdict"
            exit 1
          }

      # ── the fail-closed policy, proven rather than declared ────────────────
      #
      # Every gate above reads the canonical corpus out of a sibling checkout,
      # and this repo used to answer "sibling absent" two ways: the ctest suites
      # and two of the scripts SKIPped with exit 0, while check-wasm-corpus-column.sh
      # and assertion-ordering-check failed. They all refuse now
      # (#lzcppsiblingskipvsfail) — and a policy that is only asserted in comments
      # is one edit from being untrue, so it is exercised here.
      #
      # Each guard is run against a corpus path that does not exist and must
      # both exit non-zero AND say why. The second half is not decoration: with
      # the corpus absent every one of these has some downstream reason to fail
      # (an empty manifest, an unrun tier), and a guard failing for the wrong
      # reason would let a reintroduced skip pass this step. So the refusal
      # message is what is matched, not the exit code alone.
      #
      # Run last among the gates so nothing here can disturb the evidence the
      # real runs above produced; it writes its own manifest to a scratch path.
      - name: Fail-closed proof — the corpus guards refuse an absent corpus (#lzcppsiblingskipvsfail)
        shell: bash
        run: |
          absent="$RUNNER_TEMP/no-such-corpus"
          rm -rf "$absent"
          refuse() {
            local label="$1"; shift
            local out rc=0
            out=$(LAZILY_SPEC_CONFORMANCE_DIR="$absent" \
                  LAZILY_CONFORMANCE_MANIFEST="$RUNNER_TEMP/failclosed-manifest.txt" \
                  "$@" 2>&1) || rc=$?
            if (( rc == 0 )); then
              echo "$out"
              echo "::error::$label exited 0 with the canonical corpus absent — it skipped instead of refusing"
              exit 1
            fi
            if ! grep -q "canonical conformance corpus not found" <<<"$out"; then
              echo "$out"
              echo "::error::$label reddened with the corpus absent, but not because of the corpus — the refusal message is missing, so this proves nothing"
              exit 1
            fi
            echo "$label: refused an absent corpus (exit $rc)"
          }
          refuse "ctest ReactiveGraphConformance" \
            ctest --test-dir build -R ReactiveGraphConformance --output-on-failure --no-tests=error
          refuse "check-conformance-coverage.sh" \
            ./scripts/check-conformance-coverage.sh "$RUNNER_TEMP/failclosed-manifest.txt"
          refuse "check-wasm-corpus-column.sh" ./scripts/check-wasm-corpus-column.sh
          refuse "check-wasm-tiers.sh" ./scripts/check-wasm-tiers.sh
          # The ordering checker lives in the sibling's scripts/ rather than its
          # conformance/, so it is redirected by sibling root, not corpus dir.
          refuse "make assertion-ordering-check" \
            make assertion-ordering-check LAZILY_SPEC_DIR="$RUNNER_TEMP/no-such-sibling"

      # The gate that keeps every step above honest (#lzcheckcireachguard). It
      # compares `make check`'s prerequisite closure against the run: bodies in
      # this file and fails on any target CI does not reach. Comments inside run:
      # bodies are stripped first — a naive grep for "make check" reported all
      # nine bindings as covered and every one of those hits was a comment.
      #
      # It lives in this matrix job, last, rather than in a job of its own: the
      # gates it audits run here, so removing or re-triggering this job can never
      # strip the auditor while leaving the audited steps behind. It is pure text
      # processing over the Makefile and this file (`make -n`, never `make -p`,
      # which would dump the job's whole environment into the log), so running it
      # once per compiler costs seconds and depends on nothing the matrix varies.
      - name: CI-reachability guard (#lzcheckcireachguard)
        shell: bash
        run: |
          out=$(./scripts/check-ci-reach.sh 2>&1) || { echo "$out"; echo "::error::a make check gate is unreachable from CI"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "check-ci-reach: OK" || {
            echo "::error::the CI-reachability guard exited 0 without reaching its verdict"
            exit 1
          }

  # wasm32 tiers (`#lzcppwasm`). Separate job: it needs the emsdk toolchain and
  # nothing the native matrix varies. Both tiers are built AND their conformance
  # suites replayed under Node — building alone would prove the headers compile
  # while saying nothing about whether the graph evaluates on the target.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch canonical lazily-spec conformance fixtures (#lzspecconf)
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec

      # Assert the corpus is really there before anything runs. The suites refuse
      # a missing sibling checkout now rather than skipping over it
      # (#lzcppsiblingskipvsfail), so this is no longer what stands between the
      # job and a vacuous pass — it is what names the missing input before an
      # emsdk install and two full tier builds fail for a reason nobody reads.
      - name: Assert the canonical corpus is present
        run: |
          test -d ../lazily-spec/conformance || {
            echo "::error::canonical conformance corpus missing; the wasm suites cannot replay anything"
            exit 1
          }

      # Pinned to the emsdk this was actually verified against, not to `latest`.
      # An unpinned toolchain turns "the tiers built" into "the tiers built on
      # whatever shipped this morning", and a wasm ABI/flag change would land as
      # an unexplained red on an unrelated PR.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.6
          actions-cache-folder: emsdk-cache

      - name: Build + replay the core tier
        run: make wasm-core EMSDK_ENV=$EMSDK/emsdk_env.sh

      - name: Build + replay the threaded tier
        run: make wasm-threaded EMSDK_ENV=$EMSDK/emsdk_env.sh

      # Generates the matrix from the manifests those two runs produced and
      # fails when the committed WASM.md differs, when a tier fell below its
      # fixture floor, or when a family is absent from wasm with no recorded
      # reason. This is the step that makes the published matrix evidence
      # rather than prose.
      - name: Capability matrix guard
        shell: bash
        run: |
          out=$(./scripts/check-wasm-tiers.sh 2>&1) || { echo "$out"; echo "::error::wasm tier/matrix guard failed"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "wasm tier/matrix guard: OK" || {
            echo "::error::the wasm guard exited 0 without reaching its verdict"
            exit 1
          }
