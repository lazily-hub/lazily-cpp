# wasm build tiers (`#lzcppwasm`) — the single source of truth.
#
# Read by BOTH `tests/wasm.cmake` (which targets to build under Emscripten) and
# `scripts/check-wasm-tiers.sh` (which generates and audits the WASM.md matrix).
# One file, so a runner cannot be built in a tier the matrix does not report, or
# reported in a tier nothing builds. The guard fails when the two disagree.
#
# Format:  tier | cmake-target | ctest-name | reason
#
#   core         builds for wasm32 with no special flags, single-threaded.
#   threaded     needs -pthread (and therefore SharedArrayBuffer + COOP/COEP
#                headers from the host). `reason` names what forces it.
#   native-only  cannot build for wasm at all. `reason` is REQUIRED and names
#                the specific POSIX facility. There are no blank cells.
#
# Tier assignment here is MEASURED, not declared: every row was established by
# compiling the runner with `em++` in each tier and recording which succeeded.
# `make wasm-core` / `make wasm-threaded` re-prove it on every run — a row that
# claims the wrong tier fails the build rather than the review.

