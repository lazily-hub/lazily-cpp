# ── threaded: wasm32 + -pthread ─────────────────────────────────────────────
threaded|test_collections_family_conformance|CollectionsFamilyConformance|ThreadSafeContext and AsyncContext flavors are the subject under test
threaded|test_family_sync|family_sync|drives the ingress plane, which is threaded
threaded|test_ingress_conformance|IngressConformance|ingress.hpp schedules run on the threaded ingress plane
threaded|test_queue_conformance|QueueConformance|queue.hpp pulls async_context.hpp and thread_safe.hpp
threaded|test_reactive_graph_conformance|ReactiveGraphConformance|replays the async-cell scenarios through AsyncContext
threaded|test_topic_conformance|TopicConformance|topic fan-out rides queue.hpp's threaded plane
threaded|test_work_queue_conformance|WorkQueueConformance|work_queue.hpp is the threaded tier by definition

# ── native-only: excluded from wasm, with the reason ────────────────────────
native-only|test_distributed_conformance|DistributedConformance|resolves ShmBlobRef through transport.hpp's ShmBackend; POSIX shm_open/mmap has no wasm implementation
native-only|test_reliable_sync|reliable_sync|reliable_sync.hpp's durable outbox is file-backed (unistd.h/fcntl.h)
native-only|test_outbox_store|OutboxStoreConformance|exercises the same file-backed outbox store as reliable_sync
native-only|test_ipc|ipc|drives LazilyFfiChannel from ffi.hpp, the native C-ABI shared-library seam; a wasm consumer links the module instead, so there is no channel to replay against
